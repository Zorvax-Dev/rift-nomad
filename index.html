<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#010711">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rift Nomad">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="rift_nomad_icon.png">
  <title>Rift Nomad</title>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010711;overscroll-behavior:none;touch-action:none}
    body{position:fixed;inset:0}
    #canvas{position:fixed!important;inset:0!important;display:block!important;width:100vw!important;height:100vh!important;height:100dvh!important;max-width:none!important;max-height:none!important;outline:none;touch-action:none;background:#010711}
    #rift-boot{position:fixed;inset:0;z-index:99990;background:#010711 url("index.png") center center/cover no-repeat;opacity:1;transition:opacity .22s ease;pointer-events:none}
    #rift-boot.rift-hidden{opacity:0}
    #rift-boot::after{content:"INITIALISATION";position:absolute;left:50%;bottom:max(34px,env(safe-area-inset-bottom));transform:translateX(-50%);color:rgba(220,245,255,.84);font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.24em;text-shadow:0 2px 12px #000;animation:riftPulse 1.1s ease-in-out infinite}
    @keyframes riftPulse{0%,100%{opacity:.45}50%{opacity:1}}
    #rift-rotate{display:none;position:fixed;inset:0;z-index:99999;align-items:center;justify-content:center;text-align:center;padding:40px;background:#010711;color:#dff7ff;font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #rift-error{display:none;position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:rgba(3,10,24,.86);color:#dff7ff;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;white-space:nowrap}
    @media (orientation:portrait){#rift-rotate{display:flex}#canvas{visibility:hidden}}
  </style>
</head>
<body>
  <canvas id="canvas">Votre navigateur ne prend pas en charge Canvas.</canvas>
  <div id="rift-boot"><div id="rift-error"></div></div>
  <div id="rift-rotate">Tourne ton iPhone : Rift Nomad se joue en paysage</div>
  <script src="index.js"></script>
  <script>
    const RIFT_BUILD = "64";
    const bootStartedAt = performance.now();
    const canvas = document.getElementById("canvas");
    const boot = document.getElementById("rift-boot");
    const errorBox = document.getElementById("rift-error");

    // Remplace l'ancien worker Godot (cache agressif) par un worker réseau-first sans cache de build.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(async (registrations) => {
        for (const registration of registrations) {
          const worker = registration.active || registration.waiting || registration.installing;
          const scriptURL = worker ? worker.scriptURL : "";
          if (scriptURL.includes("index.service.worker.js")) {
            try { await registration.unregister(); } catch (_) {}
          }
        }
        try {
          await navigator.serviceWorker.register("rift-sw.js", {scope:"./", updateViaCache:"none"});
        } catch (_) {}
      }).catch(() => {});
    }

    const requestLandscape = () => {
      try {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("landscape").catch(() => {});
        }
      } catch (_) {}
    };
    window.addEventListener("pointerdown", requestLandscape, {once:true});
    window.addEventListener("touchstart", requestLandscape, {once:true, passive:true});

    const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":27268800,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
    engine.startGame().then(() => {
      const elapsed = performance.now() - bootStartedAt;
      const remaining = Math.max(0, 1050 - elapsed);
      window.setTimeout(() => {
        requestAnimationFrame(() => {
          boot.classList.add("rift-hidden");
          window.setTimeout(() => boot.remove(), 280);
        });
      }, remaining);
    }).catch((err) => {
      console.error(err);
      errorBox.textContent = "Impossible de lancer Rift Nomad";
      errorBox.style.display = "block";
    });
  </script>
</body>
</html>
